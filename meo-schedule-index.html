<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>meo schedule</title>
  <style>
    :root {
      --bg: #f5f5f2; --panel: #fff; --ink: #171717; --muted: #777872;
      --line: #e8e8e2; --accent: #c9f36a; --dark: #171717; --danger: #b83232;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .app { width: min(100%, 980px); margin: 0 auto; padding: 28px 18px 48px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:28px; }
    .brand { font-size: 1.1rem; font-weight: 900; letter-spacing: -.06em; }
    .brand span { display:inline-block; background:var(--accent); padding:4px 7px; border-radius:7px; margin-right:5px; }
    .today { color:var(--muted); font-size:.78rem; text-align:right; }
    .hero { background:var(--dark); color:white; border-radius:24px; padding:26px; display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:20px; }
    .eyebrow { color:var(--accent); font-size:.72rem; text-transform:uppercase; letter-spacing:.15em; font-weight:800; }
    h1 { font-size:clamp(2rem, 6vw, 3.5rem); letter-spacing:-.07em; line-height:1; margin:12px 0 10px; }
    .hero p { margin:0; color:#c8c8c3; font-size:.92rem; }
    .count { text-align:right; min-width:85px; }
    .count strong { display:block; font-size:2.8rem; line-height:1; letter-spacing:-.07em; }
    .count span { color:#c8c8c3; font-size:.75rem; }
    .layout { display:grid; grid-template-columns: 330px 1fr; gap:20px; align-items:start; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px; }
    h2 { font-size:1.05rem; letter-spacing:-.03em; margin:0 0 18px; }
    label { display:block; font-size:.78rem; font-weight:750; margin:0 0 7px; }
    input, select { width:100%; min-width:0; padding:12px 11px; border:1px solid #deded7; border-radius:11px; background:#fff; color:var(--ink); font:inherit; font-size:.9rem; outline:none; }
    input:focus, select:focus { border-color:#777; box-shadow:0 0 0 3px #c9f36a55; }
    .field { margin-bottom:15px; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    button { border:0; border-radius:12px; cursor:pointer; font:inherit; font-weight:800; transition:transform .12s, opacity .12s; }
    button:active { transform:scale(.98); }
    .submit { width:100%; padding:13px; background:var(--accent); color:#171717; margin-top:3px; }
    .reset { background:transparent; color:var(--muted); padding:10px 0 0; width:100%; font-size:.8rem; }
    .schedule-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:15px; }
    .schedule-head h2 { margin:0; }
    .filter { width:auto; max-width:150px; padding:9px 10px; font-size:.8rem; }
    .day-title { font-size:.75rem; font-weight:850; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin:20px 0 10px; }
    .day-title:first-child { margin-top:0; }
    .lesson { display:grid; grid-template-columns:5px 1fr auto; gap:12px; align-items:stretch; border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:9px; }
    .stripe { background:var(--accent); border-radius:8px; }
    .lesson-info { min-width:0; }
    .lesson-name { font-weight:850; font-size:.94rem; overflow-wrap:anywhere; }
    .lesson-time { color:var(--muted); font-size:.78rem; margin-top:5px; }
    .lesson-note { color:var(--muted); font-size:.76rem; margin-top:5px; }
    .delete { background:#f4f4f0; color:var(--danger); width:32px; height:32px; align-self:center; font-size:1rem; }
    .empty { text-align:center; padding:38px 14px; color:var(--muted); border:1px dashed #d9d9d1; border-radius:14px; font-size:.88rem; }
    .empty strong { display:block; color:var(--ink); margin-bottom:6px; }
    .footer { color:var(--muted); font-size:.72rem; text-align:center; margin-top:22px; }
    @media (max-width:700px) {
      .app { padding:18px 13px 35px; }
      .hero { padding:22px; border-radius:20px; }
      .layout { grid-template-columns:1fr; }
      .panel { padding:18px; }
      header { margin-bottom:20px; }
    }
    @media (max-width:360px) { .hero { align-items:start; flex-direction:column; } .count { text-align:left; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span>m.</span> meo schedule</div>
      <div class="today" id="today"></div>
    </header>

    <section class="hero">
      <div>
        <div class="eyebrow">your school planner</div>
        <h1>atur jadwal.<br>gas belajar.</h1>
        <p>semua pelajaran, satu tempat.</p>
      </div>
      <div class="count"><strong id="totalCount">0</strong><span>jadwal tersimpan</span></div>
    </section>

    <section class="layout">
      <div class="panel">
        <h2 id="formTitle">tambah pelajaran</h2>
        <form id="lessonForm">
          <div class="field">
            <label for="subject">mata pelajaran</label>
            <select id="subject" required>
              <option value="">pilih pelajaran</option>
              <option>Matematika</option><option>Bahasa Indonesia</option><option>Bahasa Inggris</option>
              <option>Fisika</option><option>Kimia</option><option>Biologi</option>
              <option>Sejarah</option><option>Geografi</option><option>Ekonomi</option>
              <option>Sosiologi</option><option>PPKn</option><option>Informatika</option>
              <option>Pendidikan Jasmani</option><option>Seni Budaya</option><option>Agama</option>
              <option value="custom">lainnya...</option>
            </select>
          </div>
          <div class="field" id="customField" hidden>
            <label for="customSubject">nama pelajaran</label>
            <input id="customSubject" type="text" placeholder="mis. bahasa Jepang" />
          </div>
          <div class="field">
            <label for="day">hari</label>
            <select id="day" required>
              <option value="Senin">Senin</option><option value="Selasa">Selasa</option>
              <option value="Rabu">Rabu</option><option value="Kamis">Kamis</option>
              <option value="Jumat">Jumat</option><option value="Sabtu">Sabtu</option>
              <option value="Minggu">Minggu</option>
            </select>
          </div>
          <div class="two">
            <div class="field">
              <label for="start">mulai</label>
              <input id="start" type="time" value="07:00" required />
            </div>
            <div class="field">
              <label for="end">selesai</label>
              <input id="end" type="time" value="08:30" required />
            </div>
          </div>
          <div class="field">
            <label for="room">ruang / catatan <span style="font-weight:400;color:#888">(opsional)</span></label>
            <input id="room" type="text" placeholder="mis. ruang 2 atau bawa buku paket" maxlength="80" />
          </div>
          <button class="submit" type="submit" id="submitBtn">+ simpan jadwal</button>
          <button class="reset" type="button" id="cancelEdit" hidden>batal edit</button>
        </form>
      </div>

      <div class="panel">
        <div class="schedule-head">
          <h2>jadwal pelajaran</h2>
          <select class="filter" id="dayFilter" aria-label="filter hari">
            <option value="all">semua hari</option>
            <option>Senin</option><option>Selasa</option><option>Rabu</option>
            <option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option>
          </select>
        </div>
        <div id="scheduleList"></div>
      </div>
    </section>
    <div class="footer">meo schedule · jadwal tersimpan otomatis di perangkat ini</div>
  </main>

  <script>
    const days = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu"];
    const $ = (id) => document.getElementById(id);
    const form = $("lessonForm");
    let lessons = [];
    let editingId = null;

    try { lessons = JSON.parse(localStorage.getItem("meoScheduleLessons") || "[]"); }
    catch { lessons = []; }

    $("today").textContent = new Intl.DateTimeFormat("id-ID", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    }).format(new Date());

    $("subject").addEventListener("change", () => {
      const custom = $("subject").value === "custom";
      $("customField").hidden = !custom;
      $("customSubject").required = custom;
      if (!custom) $("customSubject").value = "";
    });

    function save() {
      localStorage.setItem("meoScheduleLessons", JSON.stringify(lessons));
      render();
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[char]));
    }

    function render() {
      $("totalCount").textContent = lessons.length;
      const filter = $("dayFilter").value;
      const sorted = [...lessons].sort((a, b) =>
        days.indexOf(a.day) - days.indexOf(b.day) || a.start.localeCompare(b.start)
      ).filter(item => filter === "all" || item.day === filter);
      const list = $("scheduleList");
      if (!sorted.length) {
        list.innerHTML = '<div class="empty"><strong>belum ada jadwal</strong>tambahin pelajaran lewat form di sebelah.</div>';
        return;
      }
      let html = "";
      let currentDay = "";
      sorted.forEach(item => {
        if (item.day !== currentDay) {
          currentDay = item.day;
          html += `<div class="day-title">${escapeHTML(currentDay)}</div>`;
        }
        html += `<article class="lesson">
          <div class="stripe"></div>
          <div class="lesson-info">
            <div class="lesson-name">${escapeHTML(item.subject)}</div>
            <div class="lesson-time">${escapeHTML(item.start)} – ${escapeHTML(item.end)}</div>
            ${item.room ? `<div class="lesson-note">${escapeHTML(item.room)}</div>` : ""}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;justify-content:center">
            <button class="delete" type="button" title="edit jadwal" aria-label="edit ${escapeHTML(item.subject)}" onclick="editLesson('${item.id}')">✎</button>
            <button class="delete" type="button" title="hapus jadwal" aria-label="hapus ${escapeHTML(item.subject)}" onclick="deleteLesson('${item.id}')">×</button>
          </div>
        </article>`;
      });
      list.innerHTML = html;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const chosen = $("subject").value;
      const subject = chosen === "custom" ? $("customSubject").value.trim() : chosen;
      const start = $("start").value;
      const end = $("end").value;
      if (!subject) { alert("pilih atau tulis nama pelajaran dulu."); return; }
      if (start >= end) { alert("jam selesai harus setelah jam mulai."); return; }

      const item = {
        id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
        subject, day: $("day").value, start, end, room: $("room").value.trim()
      };
      if (editingId) lessons = lessons.map(old => old.id === editingId ? item : old);
      else lessons.push(item);
      save();
      resetForm();
    });

    function editLesson(id) {
      const item = lessons.find(lesson => lesson.id === id);
      if (!item) return;
      editingId = id;
      const options = [...$("subject").options].map(option => option.value);
      if (options.includes(item.subject)) {
        $("subject").value = item.subject;
        $("customField").hidden = true;
        $("customSubject").required = false;
      } else {
        $("subject").value = "custom";
        $("customField").hidden = false;
        $("customSubject").required = true;
        $("customSubject").value = item.subject;
      }
      $("day").value = item.day;
      $("start").value = item.start;
      $("end").value = item.end;
      $("room").value = item.room || "";
      $("formTitle").textContent = "edit pelajaran";
      $("submitBtn").textContent = "simpan perubahan";
      $("cancelEdit").hidden = false;
      $("formTitle").scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function deleteLesson(id) {
      if (!confirm("hapus jadwal pelajaran ini?")) return;
      lessons = lessons.filter(item => item.id !== id);
      if (editingId === id) resetForm();
      save();
    }

    function resetForm() {
      editingId = null;
      form.reset();
      $("start").value = "07:00";
      $("end").value = "08:30";
      $("day").value = "Senin";
      $("customField").hidden = true;
      $("customSubject").required = false;
      $("formTitle").textContent = "tambah pelajaran";
      $("submitBtn").textContent = "+ simpan jadwal";
      $("cancelEdit").hidden = true;
    }

    $("cancelEdit").addEventListener("click", resetForm);
    $("dayFilter").addEventListener("change", render);
    render();
  </script>
</body>
</html>
