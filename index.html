<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d5dfc">
  <title>Meo Schedule</title>
  <style>
    :root { --purple:#6d5dfc; --purple-dark:#5142dc; --ink:#20213a; --muted:#777b96; --line:#ececf5; --bg:#f6f7fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    .app { max-width:980px; margin:0 auto; padding:28px 18px 48px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { width:48px; height:48px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(135deg,#8b7cff,#5c4be8); color:white; font-size:24px; box-shadow:0 8px 20px #6d5dfc40; }
    h1 { font-size:clamp(24px,4vw,34px); margin:0; letter-spacing:-1px; }
    .sub { color:var(--muted); margin-top:4px; font-size:14px; }
    .pill { background:#eeecff; color:var(--purple-dark); padding:9px 13px; border-radius:999px; font-weight:700; font-size:12px; white-space:nowrap; }
    .hero { background:linear-gradient(120deg,#6d5dfc,#887aff); color:white; padding:26px; border-radius:24px; display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:22px; box-shadow:0 14px 35px #6d5dfc24; }
    .hero h2 { margin:0 0 8px; font-size:24px; letter-spacing:-.5px; }
    .hero p { margin:0; color:#efedff; font-size:14px; line-height:1.6; }
    .hero-stat { min-width:100px; text-align:center; background:#ffffff20; border:1px solid #ffffff35; padding:14px 18px; border-radius:18px; }
    .hero-stat strong { display:block; font-size:32px; line-height:1.2; }
    .hero-stat span { font-size:12px; color:#efedff; }
    .layout { display:grid; grid-template-columns: minmax(260px, .85fr) minmax(0, 1.4fr); gap:20px; align-items:start; }
    .panel { background:white; border:1px solid #eeeef6; border-radius:22px; padding:22px; box-shadow:0 6px 22px #24245a08; }
    .panel h3 { margin:0 0 18px; font-size:18px; }
    label { display:block; color:#555a75; font-size:12px; font-weight:750; margin:14px 0 7px; }
    input, select { width:100%; border:1px solid #e5e6f0; border-radius:12px; padding:12px 13px; font:inherit; font-size:14px; color:var(--ink); background:#fff; outline:none; }
    input:focus, select:focus { border-color:var(--purple); box-shadow:0 0 0 3px #6d5dfc18; }
    .time-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    button { border:0; cursor:pointer; font:inherit; font-weight:750; transition:transform .15s,background .15s; }
    button:active { transform:scale(.98); }
    .primary { margin-top:18px; width:100%; padding:13px 16px; color:white; background:var(--purple); border-radius:13px; box-shadow:0 8px 18px #6d5dfc35; }
    .primary:hover { background:var(--purple-dark); }
    .list-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .list-head h3 { margin:0; }
    .filter { width:auto; min-width:130px; padding:9px 10px; }
    .schedule-list { display:flex; flex-direction:column; gap:10px; }
    .lesson { display:grid; grid-template-columns:5px 1fr auto; gap:13px; align-items:center; padding:14px; border:1px solid var(--line); border-radius:16px; }
    .lesson-bar { height:48px; border-radius:99px; background:var(--purple); }
    .lesson:nth-child(5n+2) .lesson-bar { background:#ff9b61; }
    .lesson:nth-child(5n+3) .lesson-bar { background:#43b9a2; }
    .lesson:nth-child(5n+4) .lesson-bar { background:#e76caa; }
    .lesson:nth-child(5n+5) .lesson-bar { background:#e7b93e; }
    .lesson h4 { margin:0 0 5px; font-size:15px; }
    .lesson-meta { color:var(--muted); font-size:12px; }
    .lesson-time { font-weight:800; font-size:12px; white-space:nowrap; text-align:right; }
    .delete { display:block; margin:7px 0 0 auto; padding:4px 0; background:transparent; color:#d44f68; font-size:11px; }
    .empty { text-align:center; padding:34px 14px; color:var(--muted); border:1px dashed #dfe0ee; border-radius:16px; }
    .empty-icon { font-size:30px; margin-bottom:8px; }
    .empty strong { display:block; color:var(--ink); margin-bottom:5px; }
    footer { text-align:center; color:#9a9db2; font-size:12px; margin-top:24px; }
    .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); padding:12px 17px; background:#24233e; color:white; border-radius:12px; font-size:13px; box-shadow:0 8px 25px #0002; opacity:0; pointer-events:none; transition:opacity .2s; }
    .toast.show { opacity:1; }
    @media(max-width:720px) { .layout{grid-template-columns:1fr;} .hero{padding:21px;} .hero-stat{min-width:82px;padding:12px;} .hero-stat strong{font-size:27px;} .panel{padding:18px;} }
    @media(max-width:420px) { .app{padding:20px 12px 36px;} .pill{display:none;} .hero h2{font-size:20px;} .hero p{font-size:12px;} .lesson{padding:11px;gap:10px;} .lesson-time{font-size:11px;} }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">✦</div>
        <div><h1>Meo Schedule</h1><div class="sub">Atur jadwal sekolahmu dengan mudah</div></div>
      </div>
      <div class="pill">✦ STUDY PLANNER</div>
    </header>

    <section class="hero">
      <div><h2>Hai, siap belajar? 👋</h2><p>Susun pelajaran, atur jam, dan lihat jadwalmu<br>semua dalam satu tempat.</p></div>
      <div class="hero-stat"><strong id="totalCount">0</strong><span>Jadwal tersimpan</span></div>
    </section>

    <section class="layout">
      <div class="panel">
        <h3>＋ Tambah pelajaran</h3>
        <form id="scheduleForm">
          <label for="subject">Nama pelajaran</label>
          <input id="subject" name="subject" placeholder="Contoh: Matematika" maxlength="60" required>
          <label for="day">Hari</label>
          <select id="day" name="day" required>
            <option value="Senin">Senin</option><option value="Selasa">Selasa</option>
            <option value="Rabu">Rabu</option><option value="Kamis">Kamis</option>
            <option value="Jumat">Jumat</option><option value="Sabtu">Sabtu</option><option value="Minggu">Minggu</option>
          </select>
          <div class="time-row">
            <div><label for="start">Mulai</label><input id="start" type="time" value="07:00" required></div>
            <div><label for="end">Selesai</label><input id="end" type="time" value="08:30" required></div>
          </div>
          <label for="room">Ruangan (opsional)</label>
          <input id="room" placeholder="Contoh: Kelas 10A" maxlength="40">
          <button class="primary" type="submit">Simpan jadwal ↗</button>
        </form>
      </div>

      <div class="panel">
        <div class="list-head">
          <h3>Jadwal pelajaran</h3>
          <select class="filter" id="dayFilter" aria-label="Filter hari">
            <option value="Semua">Semua hari</option><option>Senin</option><option>Selasa</option>
            <option>Rabu</option><option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option>
          </select>
        </div>
        <div id="scheduleList" class="schedule-list"></div>
      </div>
    </section>
    <footer>Meo Schedule · Jadwalmu tersimpan otomatis di perangkat ini.</footer>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script>
    const days = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
    const form = document.getElementById('scheduleForm');
    const list = document.getElementById('scheduleList');
    const filter = document.getElementById('dayFilter');
    const totalCount = document.getElementById('totalCount');
    const toast = document.getElementById('toast');
    let schedules = [];
    try { schedules = JSON.parse(localStorage.getItem('meoScheduleItems') || '[]'); } catch { schedules = []; }

    function save() {
      localStorage.setItem('meoScheduleItems', JSON.stringify(schedules));
      render();
    }
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.setTimeout(() => toast.classList.remove('show'), 2200);
    }
    function render() {
      const selectedDay = filter.value;
      const shown = schedules.filter(item => selectedDay === 'Semua' || item.day === selectedDay)
        .sort((a,b) => days.indexOf(a.day) - days.indexOf(b.day) || a.start.localeCompare(b.start));
      totalCount.textContent = schedules.length;
      list.innerHTML = '';
      if (!shown.length) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">🗓️</div><strong>Belum ada jadwal</strong><span>Tambahkan pelajaran lewat formulir di samping.</span></div>';
        return;
      }
      shown.forEach(item => {
        const card = document.createElement('article');
        card.className = 'lesson';
        const bar = document.createElement('div'); bar.className = 'lesson-bar';
        const info = document.createElement('div');
        const title = document.createElement('h4'); title.textContent = item.subject;
        const meta = document.createElement('div'); meta.className = 'lesson-meta';
        meta.textContent = item.day + (item.room ? ' · ' + item.room : '');
        info.append(title, meta);
        const right = document.createElement('div');
        const time = document.createElement('div'); time.className = 'lesson-time'; time.textContent = item.start + '–' + item.end;
        const del = document.createElement('button'); del.className = 'delete'; del.type = 'button'; del.textContent = 'Hapus';
        del.setAttribute('aria-label', 'Hapus jadwal ' + item.subject);
        del.addEventListener('click', () => {
          schedules = schedules.filter(entry => entry.id !== item.id);
          save(); showToast('Jadwal berhasil dihapus.');
        });
        right.append(time, del);
        card.append(bar, info, right);
        list.append(card);
      });
    }
    form.addEventListener('submit', event => {
      event.preventDefault();
      const subject = document.getElementById('subject').value.trim();
      const day = document.getElementById('day').value;
      const start = document.getElementById('start').value;
      const end = document.getElementById('end').value;
      const room = document.getElementById('room').value.trim();
      if (!subject) { showToast('Isi nama pelajaran dulu ya.'); return; }
      if (start >= end) { showToast('Jam selesai harus setelah jam mulai.'); return; }
      schedules.push({ id: Date.now().toString() + Math.random().toString(16).slice(2), subject, day, start, end, room });
      save();
      form.reset();
      document.getElementById('start').value = '07:00';
      document.getElementById('end').value = '08:30';
      showToast('Jadwal berhasil disimpan!');
    });
    filter.addEventListener('change', render);
    render();
  </script>
</body>
</html>
